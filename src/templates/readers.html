
<header class="page-head">
  <div class="wrap">
    <p class="eyebrow">Bilingual Reader</p>
    <h1>双语书架</h1>
    <p class="page-lede">{{count}} 篇英文长文，逐句拆成 {{pairs}} 组对照。左边英文、右边中文，读到哪句不懂就悬停，另一侧同步亮起；术语有卡，图有逐条解读，译者觉得有坑的地方写了注。</p>
    <ul class="mech">
      <li><b>悬停联动</b><span>任一句悬停，另一侧同一句高亮</span></li>
      <li><b>术语卡</b><span>虚线下划线处悬停看解释</span></li>
      <li><b>译者注</b><span>上标数字，点开是补的背景</span></li>
    </ul>
  </div>
</header>
<section class="block">
  <div class="wrap">
    <div class="read-list">{{rows}}</div>
  </div>
</section>
