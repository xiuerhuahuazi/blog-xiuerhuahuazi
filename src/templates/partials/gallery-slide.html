<figure class="gslide" data-pos="hidden" data-wide="{{wide}}" style="--ar:{{ar}}">
  <button class="gslide-hit" type="button" aria-label="查看提示词：{{caption}}"><img class="gslide-img" src="{{src}}" alt="{{caption}}"></button>
  <figcaption class="gslide-cap" hidden>{{caption}}</figcaption>
  <p class="gslide-meta" hidden>{{meta}}</p>
  <div class="gslide-prompt" hidden>{{prompt_html}}</div>
  <pre class="gslide-raw" hidden>{{prompt}}</pre>
</figure>
