<div class="gallery deck-body" data-count="{{count}}" data-wide="{{wide}}">
  <div class="gallery-stage">
    <div class="gallery-track">{{slides}}</div>
    <button class="gallery-arrow prev" type="button" aria-label="上一张">‹</button>
    <button class="gallery-arrow next" type="button" aria-label="下一张">›</button>
  </div>
  <p class="gallery-cap"><span class="gallery-cap-text"></span><span class="gallery-cap-meta"></span></p>
</div>
