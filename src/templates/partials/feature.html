
<section class="feature-wrap">
  <div class="wrap">
    <a class="feature" href="{{href}}" data-reveal>
      {{media}}
      <div class="feature-body">
        <p class="kicker">本期精读 · {{date}}</p>
        <h2 class="feature-title">{{title}}</h2>
        <p class="feature-en" lang="en">{{title_en}}</p>
        <p class="feature-blurb">{{blurb}}</p>
        <div class="feature-meta">{{meta}}</div>
        <span class="cta">进入阅读 <span aria-hidden="true">→</span></span>
      </div>
    </a>
  </div>
</section>
