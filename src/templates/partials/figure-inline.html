<figure class="post-figure" data-wide="{{wide}}" style="--ar:{{ar}}">
  <button class="pf-hit" type="button" aria-label="查看提示词：{{caption}}"><img class="gslide-img" src="{{src}}" alt="{{caption}}"></button>
  <figcaption class="pf-cap gslide-cap">{{caption}}</figcaption>
  <p class="pf-meta gslide-meta">{{meta}}</p>
  <div class="gslide-prompt" hidden>{{prompt_html}}</div>
  <pre class="gslide-raw" hidden>{{prompt}}</pre>
</figure>
