<article class="read-row" data-reveal style="--i:{{i}}">
  <span class="row-num" aria-hidden="true">{{num}}</span>
  <div class="row-main">
    <{{tag}} class="row-title"><a href="{{href}}">{{title_zh}}</a></{{tag}}>
    <p class="row-en" lang="en">{{title_en}}</p>
    <p class="row-blurb">{{blurb}}</p>
  </div>
  <div class="row-meta">
    {{meta}}
    <span class="row-date">{{date}}</span>
    <span class="row-go" aria-hidden="true">↗</span>
  </div>
</article>
