<li class="file-row">
  <div class="file-card">
    <button class="file-open" type="button" aria-haspopup="dialog"><span class="file-kind">{{kind}}</span><span class="file-main"><span class="file-name">{{name}}</span><span class="file-desc">{{desc}}</span></span></button>
    <span class="file-size">{{size}}</span>
    <a class="file-dl" href="{{href}}" download>下载</a>
  </div>
  <div class="doc-src" hidden><pre>{{doc}}</pre></div>
</li>
